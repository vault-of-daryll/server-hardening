# Copy to inventory.ini (ignored by Git). One line per server.
# ansible_port is the SSH port the server already uses; the kit keeps it.
[servers]
vps1 ansible_host=203.0.113.10 ansible_user=deploy ansible_port=22

[servers:vars]
# Public TCP ports besides SSH. Leave empty for a Cloudflare Tunnel host.
open_ports=[]
# Set to "local" if you use ssh -L tunnels.
ssh_allow_tcp_forwarding=no
# Accounts allowed to log in over SSH. Default: ansible_user only.
# ssh_allow_users=["deploy"]
# Tunnel-only SSH (no SSH port open to the internet). Needs a tunnel in ansible_ssh_common_args, e.g.
# ansible_ssh_common_args="-o ProxyCommand='cloudflared access ssh --hostname ssh.example.com'"
# ssh_public=false

# Opt in to Docker stable updates; engine upgrades can stop containers.
docker_auto_updates=false
