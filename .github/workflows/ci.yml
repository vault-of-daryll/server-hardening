name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-controller.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-lint -p harden.yml verify.yml
      - run: |
          for script in tests/*.sh; do bash -n "$script" || exit; done
          for hook in .githooks/*; do sh -n "$hook" || exit; done

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
      # Here because this job has the full history and the pinned gitleaks the hook tests need.
      - run: PATH="$PWD:$PATH" bash tests/hook-test.sh

  container-test:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/library/ubuntu@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8 # ubuntu 24.04
          - docker.io/library/ubuntu@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db # ubuntu 26.04
          - docker.io/library/debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6 # debian 13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-controller.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - run: TEST_IMAGE=${{ matrix.image }} bash tests/container-test.sh

  # One stable name for branch protection to require, whatever the matrix holds.
  ci-ok:
    if: always()
    needs: [lint, secrets, container-test]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; jobs = json.loads(os.environ["NEEDS"]); assert all(job["result"] == "success" for job in jobs.values()), jobs'
